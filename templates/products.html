{% extends "base.html" %}

{% block title %}Products - RetailHub{% endblock %}

{% block content %}
<div class="products-header">
    <h1>Our Products</h1>
    <div class="filters">
        <button class="filter-btn active" onclick="filterProducts('all')">All</button>
        <button class="filter-btn" onclick="filterProducts('Electronics')">Electronics</button>
        <button class="filter-btn" onclick="filterProducts('Accessories')">Accessories</button>
        <button class="filter-btn" onclick="filterProducts('Office')">Office</button>
    </div>
</div>

<div class="products-grid" id="products-grid">
    <div class="loading">Loading products...</div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/products.js') }}"></script>
{% endblock %}
